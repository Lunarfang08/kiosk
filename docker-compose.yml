services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/kiosk.db
      AVATAR_DATA_DIR: /data
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    volumes:
      - ./avatar_data:/data
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  livetalking:
    profiles: ["gpu-avatar"]
    image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
    runtime: nvidia
    network_mode: host
    working_dir: /opt/LiveTalking
    volumes:
      - livetalking_src:/opt/LiveTalking
      - ./avatar_data/livetalking:/opt/LiveTalking/data/avatars
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    command: >
      bash -lc "echo 'Clone LiveTalking into the livetalking_src volume, install requirements,
      then run: python app.py --transport webrtc --model wav2lip --avatar_id wav2lip256_avatar1 --max_session 1'"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  livetalking_src:
